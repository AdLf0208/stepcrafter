[package]
# Port of Step Crafter 1.21.1-0.1.10 (starforcraft/Step-Crafter, MIT), a Refined Storage add-on.
# Minecraft Java 1.21.1 NeoForge upstream; the port targets Horizon 26.3 at the pin in
# horizon-mod.toml. Clean-room Rust rewrite from the mod's behaviour (FINDINGS.md); publishable
# under MIT with this source and upstream's LICENSE.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "stepcrafter"
version = "0.2.10"
edition = "2024"
license = "MIT"
description = "Step Crafter for Horizon: the threshold-maintained step crafting machine and its requester"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
