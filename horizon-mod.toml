id = "stepcrafter"
name = "Step Crafter"
version = "0.2.2"
description = """A port of Step Crafter for Horizon: the Step Crafter machine and its Step Requester.

The Step Crafter is a block entity that keeps a configured resource in stock. It is told a target
item, resolves that item's own crafting recipe into its step pattern, and then crafts one step at a
time out of the ingredients stocked in its 27-slot inventory: it starts when the stock of the target
falls below the configured minimum and keeps going until the maximum is reached (upstream's
`StepCrafterNetworkNode.doWork` rule). The stock is the machine's own inventory, because a Horizon mod
cannot join a Refined Storage network.

The Step Requester keeps a filtered item stocked *through* the Step Crafter beside it: when that
crafter's stock of the filter falls below the requester's minimum, it asks the crafter for batches of
the item until the maximum is reached (upstream's `StepRequesterNetworkNode.doWork` rule), and
reports a refusal it cannot serve. The Step Crafter Manager, the Step Requester Manager, the Step
Crafting Monitor, the sixteen colour variants, the slot upgrade, the energy buffer and the GUIs are
not ported yet."""
authors = ["Ultramega", "AdLf0208"]
# The original's licence: MIT (the 1.21.1 jar's META-INF/neoforge.mods.toml declares
# `license = "MIT"`); upstream's LICENSE.txt travels inside the package as LICENSE.
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# The installation side, not the hook's: the machine ticks on the server, and single player's
# integrated server belongs to the client installation, so "both".
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"): this package declares the Step Crafter block, its block entity type, the recipe, the
# loot table, the creative tab entry and the block's states.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
